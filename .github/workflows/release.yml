name: Release

# Besides push, claude-code-release.yml calls this workflow (`workflow_call`)
# when npm has a Claude Code version the latest release did not ship (#3088).
# That daily check lives in its own workflow so a no-op scheduled success never
# lands in Release's run history (main-build-monitor would read it as "green
# again" and close an open Release failure alert), and so it never joins the
# `release` concurrency group unless it is actually going to release.
# `workflow_dispatch` forces a manual release; main-build-monitor ignores it.
#
# Coalescing back-to-back merges (#3096): every run builds `main` HEAD at
# checkout time, not its own triggering commit. A push run whose triggering
# commit is already contained in the newest release tag, with that tag's
# image already pushed, exits via the `check` job without tagging, building
# or dispatching anything. That skip only confirms the image was pushed, not
# that the earlier run's fleet-infra staging dispatch succeeded — if that
# step failed, staging stays behind until a push lands outside any tag.
# Combined with the `release` concurrency group below (one running + one
# pending, older pending runs cancelled), a burst of N pushes to main yields
# at most two releases: the run already in progress, and one pending run
# that builds whatever HEAD is by the time it starts.
# Triggers removed for the public snapshot — this workflow is intentionally disabled.
# See the private source repository for the active version.
on:
  workflow_dispatch:
permissions:
  contents: write
  packages: write

concurrency:
  group: release
  cancel-in-progress: false

# Toolchain comes from this repo's flake.nix via `nix develop` — same policy
# as ci.yml: the runners are self-hosted NixOS boxes that provide only nix,
# git and docker, and each repo brings its own CI dependencies, isolated in
# the nix store. Every node/npm step below MUST be prefixed with
# `nix $NIX_FLAGS develop --command`; a bare `npm ci` dies with
# `npm: command not found` / exit 127 on a NixOS runner (issue #2343).
# No actions/setup-node, no sudo/apt-get on the runner itself. The `apt-get`
# further down runs INSIDE the Debian container image, which is a normal
# Debian userland and the intended place to install the node-gyp toolchain
# (python3/make/g++) that `better-sqlite3` and `node-pty` need to build.
#
# The devShell remains the only source of node/npm for the TypeScript build
# (`npm run build`), but `node_modules` for the release tarball is built
# inside a `node:<major>-bookworm-slim` Docker container instead: nixpkgs-
# unstable's glibc 2.42 makes node-pty's native `pty.node` require
# `cfsetospeed@GLIBC_2.42`, which the non-nix Ubuntu deploy host cannot
# resolve (issue #2348, release v2026-08-05.5 crash-looped and was rolled
# back). Building `node_modules` under Debian bookworm's older glibc keeps
# the shipped native modules loadable on the deploy host.
#
# The container steps stream files in over stdin (tar) and copy results out
# with `docker cp` — NEVER `docker run -v "$PWD":...`. The workspace lives on
# a bind mount private to the runner unit's mount namespace, so the docker
# daemon resolves that path in its own namespace and mounts an EMPTY
# directory (run 31051681679; same failure class as bin-scraper#250).
# `docker cp` to the host extracts client-side, so results come back owned
# by the runner user with no chown needed.
#
# node-gyp is pinned to the image's own headers via npm_config_nodedir=/usr/local
# so it never downloads a headers tarball, and each npm ci attempt is bounded by
# `timeout 600s` (#2862).
env:
  NIX_FLAGS: --extra-experimental-features nix-command --extra-experimental-features flakes

jobs:
  # Skips a push run whose triggering commit has already shipped, so a burst
  # of merges yields at most two releases (#3096). Always builds for a
  # `workflow_call` or `workflow_dispatch` run, since those target an
  # already-tagged HEAD to ship a new Claude Code version or a manual release.
  check:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    outputs:
      build: ${{ steps.check.outputs.build }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-tags: true
          fetch-depth: 0
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Check whether this push's commit already shipped
        id: check
        run: |
          if [ "$GITHUB_EVENT_NAME" != "push" ]; then
            echo "$GITHUB_EVENT_NAME run, always releasing main HEAD"
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          latest=$(git tag --list 'v*' --sort=-v:refname | head -n1)
          if [ -z "$latest" ] || ! git merge-base --is-ancestor "$GITHUB_SHA" "$latest" 2>/dev/null; then
            echo "$GITHUB_SHA has not shipped yet (newest tag: ${latest:-none}), releasing"
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          image="ghcr.io/$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]'):$latest"
          if out=$(docker manifest inspect "$image" 2>&1 >/dev/null); then
            msg="$GITHUB_SHA already shipped in $latest (image present); main HEAD $(git rev-parse HEAD) has nothing new from this push, skipping"
            echo "$msg"
            echo "$msg" >> "$GITHUB_STEP_SUMMARY"
            echo "build=false" >> "$GITHUB_OUTPUT"
          elif echo "$out" | grep -qiE 'no such manifest|manifest unknown'; then
            echo "$latest's image was never pushed, releasing main HEAD"
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::docker manifest inspect $image failed: $out"
            exit 1
          fi

  release:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: [self-hosted, linux, x64]
    # ~2 min warm (run 33868857954). 30 covers a cold nix closure download after a
    # flake.lock bump plus the container step's 3x apt / 3x npm ci retry loops.
    timeout-minutes: 30
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      claude_version: ${{ steps.claude.outputs.version }}
      sha: ${{ steps.head.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-tags: true
          fetch-depth: 0
      - name: Record HEAD being released
        id: head
        run: |
          sha=$(git rev-parse HEAD)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          msg="Releasing main HEAD $sha (triggered by $GITHUB_SHA)"
          echo "$msg"
          echo "$msg" >> "$GITHUB_STEP_SUMMARY"
      - name: Set up Nix
        uses: ./.github/actions/setup-nix
      - name: Check docker is available
        run: |
          command -v docker >/dev/null 2>&1 || {
            echo "::error::docker is not available on this runner. The release tarball's native modules must be built in a Debian container; ask for docker via St-John-Software/nixos-config."
            exit 1
          }
      # Every build installs an exact, recorded Claude Code version instead of
      # floating on `latest` (#3088). One attempt used to be enough, but this
      # now gates every release, so a registry blip must not lose one (#1966).
      - name: Resolve Claude Code version
        id: claude
        run: |
          v=""
          for i in 1 2 3; do
            v=$(nix $NIX_FLAGS develop --command npm view @anthropic-ai/claude-code@latest version) && break
            echo "npm view attempt $i failed, retrying after 10s" >&2
            v=""
            sleep 10
          done
          if ! echo "$v" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::npm view returned an unexpected Claude Code version after 3 attempts: '$v'"
            exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Compute version tag
        id: version
        run: |
          today=$(date -u +%Y-%m-%d)
          last=$(git tag --list "v${today}.*" --sort=-v:refname | head -n1)
          if [ -z "$last" ]; then
            v=1
          else
            v=$(( ${last##*.} + 1 ))
          fi
          echo "tag=v${today}.${v}" >> "$GITHUB_OUTPUT"

      - name: Resolve build Node major version
        id: node
        run: |
          major=$(nix $NIX_FLAGS develop --command node -p "process.versions.node.split('.')[0]")
          echo "major=$major" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$major" > .node-version

      - name: Install dependencies (portable native modules)
        env:
          IMAGE: node:${{ steps.node.outputs.major }}-bookworm-slim
        run: |
          CN="claws-release-ci-${{ github.run_id }}"
          docker rm -f "$CN" >/dev/null 2>&1 || true
          tar -cf - package.json package-lock.json .npmrc | docker run -i --name "$CN" \
            -e npm_config_cache=/tmp/.npm \
            -e npm_config_nodedir=/usr/local \
            "$IMAGE" bash -euo pipefail -c '
              mkdir -p /src && tar -xf - -C /src && cd /src
              apt_ok=0
              for i in 1 2 3; do
                if apt-get -o Acquire::Retries=3 update \
                  && apt-get install -y --no-install-recommends python3 make g++ ca-certificates; then
                  apt_ok=1; break
                fi
                echo "apt attempt $i failed (Debian mirror unreachable?), retrying after 15s"
                apt-get clean
                rm -rf /var/lib/apt/lists/*
                sleep 15
              done
              [ "$apt_ok" = 1 ] || { echo "::error::apt-get could not install the native-module build toolchain (python3 make g++ ca-certificates) after 3 attempts — deb.debian.org was unreachable from the release container."; exit 1; }
              ok=0
              for i in 1 2 3; do
                s=0
                timeout --kill-after=30s 600s npm ci || s=$?
                if [ "$s" = 0 ]; then ok=1; break; fi
                if [ "$s" = 124 ] || [ "$s" = 137 ]; then
                  echo "npm ci attempt $i exceeded the 10m timeout and was killed (#2862), retrying after 3s" >&2
                else
                  echo "npm ci attempt $i failed with exit $s, retrying after 3s" >&2
                fi
                rm -rf node_modules
                sleep 3
              done
              [ "$ok" = 1 ] || { echo "npm ci failed after 3 attempts" >&2; exit 1; }
            ' || { s=$?; docker rm -f "$CN" >/dev/null 2>&1; exit "$s"; }
          rm -rf node_modules
          docker cp "$CN":/src/node_modules ./node_modules
          docker rm "$CN" >/dev/null
      - name: Inject version into build
        run: echo 'export const VERSION = "${{ steps.version.outputs.tag }}";' > src/version.ts
      - run: nix $NIX_FLAGS develop --command npm run build

      - name: Prune dev dependencies
        env:
          IMAGE: node:${{ steps.node.outputs.major }}-bookworm-slim
        run: |
          CN="claws-release-prune-${{ github.run_id }}"
          docker rm -f "$CN" >/dev/null 2>&1 || true
          tar -cf - package.json package-lock.json .npmrc node_modules | docker run -i --name "$CN" \
            -e npm_config_cache=/tmp/.npm \
            -e npm_config_nodedir=/usr/local \
            "$IMAGE" bash -euo pipefail -c '
              mkdir -p /src && tar -xf - -C /src && cd /src
              npm prune --omit=dev
            ' || { s=$?; docker rm -f "$CN" >/dev/null 2>&1; exit "$s"; }
          rm -rf node_modules
          docker cp "$CN":/src/node_modules ./node_modules
          docker rm "$CN" >/dev/null

      - name: Verify packaged native modules are host-portable
        env:
          IMAGE: node:${{ steps.node.outputs.major }}-bookworm-slim
        run: |
          if grep -rl --include='*.node' -e '/nix/store' node_modules; then
            echo "::error::A packaged .node references /nix/store — it was compiled in the nix devShell and will not load on the non-nix deploy host (issue #2348)."
            exit 1
          fi
          tar -cf - node_modules | docker run -i --rm "$IMAGE" bash -euo pipefail -c '
            mkdir -p /src && tar -xf - -C /src && cd /src
            node -e "require(\"node-pty\"); require(\"better-sqlite3\"); require(\"sharp\"); console.log(\"native modules load OK under plain glibc\")"
          '

      - name: Create release tarball
        run: |
          rm -rf deploy/skills
          if [ -d .skills ]; then
            cp -r .skills deploy/skills
          elif [ -d .claude/skills ]; then
            cp -r .claude/skills deploy/skills
          fi
          # Normalise owner/mode: deploy.sh extracts as root, so tar would otherwise
          # restore the runner's uid/gid/mode verbatim onto the host (issue #2407).
          tar --owner=0 --group=0 --numeric-owner --mode='u+rwX,go+rX' \
            -czf claws.tar.gz dist/ deploy/ node_modules/ .node-version

      - name: Push tag
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          git tag "$TAG"
          git push origin "$TAG"

      - name: Generate release notes
        id: notes
        env:
          CLAUDE_CODE_VERSION: ${{ steps.claude.outputs.version }}
        run: |
          PREV_TAG=$(git tag --sort=-v:refname | grep -v "^${{ steps.version.outputs.tag }}$" | head -n1)
          if [ -z "$PREV_TAG" ]; then
            {
              echo "body<<RELEASE_EOF"
              echo "Claude Code CLI: $CLAUDE_CODE_VERSION"
              echo ""
              echo "Initial release"
              echo "RELEASE_EOF"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "body<<RELEASE_EOF"
              echo "Claude Code CLI: $CLAUDE_CODE_VERSION"
              echo ""
              git log --oneline --no-merges "$PREV_TAG"..HEAD | head -20
              echo "RELEASE_EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ steps.head.outputs.sha }}
          name: ${{ steps.version.outputs.tag }}
          body: ${{ steps.notes.outputs.body }}
          files: claws.tar.gz

  docker:
    needs: release
    runs-on: [self-hosted, linux, x64]
    # A hung image build must never hold the pool. Two 8-minute build attempts plus
    # checkout/buildx/nix/dispatch fits well inside this; the whole job is ~4 min
    # normally. Without it the job inherits GitHub's 360-minute default and twice on
    # 2026-09-04 blocked every [self-hosted, linux] job in the org for hours (#2861).
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.tag }}
      - name: Validate prerequisites
        env:
          GH_TOKEN: ${{ secrets.FLEET_INFRA_VERSION_BUMP }}
        run: |
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::FLEET_INFRA_VERSION_BUMP secret is not available to this workflow run"
            exit 1
          fi
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute image repo (lowercase)
        id: repo
        run: echo "name=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      # Do NOT add `cache-to: type=gha` / `cache-from: type=gha` here.
      # The gha BuildKit cache leaked 6+ GB into the org-shared 2 GB Actions
      # storage quota (issues #1698, #1717). Releases are infrequent; rebuilding
      # layers from the registry each time is the intended trade-off.
      # docker/build-push-action auto-uploads a `.dockerbuild` build record as a
      # workflow artifact on every run (default 90-day retention). With a release
      # per push to main these accumulated to 280 artifacts / 15+ MB against the
      # org-shared 2 GB Actions-storage quota (issue #1750). We don't consume the
      # build record, so disable the upload.
      # Docker Hub intermittently 500s when BuildKit resolves base-image
      # metadata (#1966). One retry absorbs the blip rather than losing the
      # image for an already-tagged release.
      - name: Build and push image
        id: build
        uses: docker/build-push-action@v7
        continue-on-error: true
        # Normal build is ~2 min (run 33901190963: 18:37:43Z -> 18:39:36Z). 8 min means a
        # hang (#2862) is killed early enough that the retry below still gets a full attempt.
        timeout-minutes: 8
        env:
          DOCKER_BUILD_RECORD_UPLOAD: "false"
        with:
          context: .
          push: true
          build-args: |
            CLAWS_VERSION=${{ needs.release.outputs.tag }}
            CLAUDE_CODE_VERSION=${{ needs.release.outputs.claude_version }}
          tags: |
            ghcr.io/${{ steps.repo.outputs.name }}:${{ needs.release.outputs.tag }}
            ghcr.io/${{ steps.repo.outputs.name }}:latest

      - name: Build and push image (retry)
        id: build-retry
        if: steps.build.outcome == 'failure'
        uses: docker/build-push-action@v7
        timeout-minutes: 8
        env:
          DOCKER_BUILD_RECORD_UPLOAD: "false"
        with:
          context: .
          push: true
          build-args: |
            CLAWS_VERSION=${{ needs.release.outputs.tag }}
            CLAUDE_CODE_VERSION=${{ needs.release.outputs.claude_version }}
          tags: |
            ghcr.io/${{ steps.repo.outputs.name }}:${{ needs.release.outputs.tag }}
            ghcr.io/${{ steps.repo.outputs.name }}:latest

      - name: Set up Nix
        if: steps.build.outcome == 'success' || steps.build-retry.outcome == 'success'
        uses: ./.github/actions/setup-nix

      - name: Dispatch fleet-infra claws-staging bump
        if: steps.build.outcome == 'success' || steps.build-retry.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.FLEET_INFRA_VERSION_BUMP }}
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          nix $NIX_FLAGS develop .#scripts --command bash -euo pipefail -c '
            gh workflow run update-claws-staging.yml \
              --repo St-John-Software/fleet-infra \
              --ref main \
              --field tag="$TAG"
            echo "Dispatched fleet-infra update-claws-staging.yml with tag=$TAG"
          '
