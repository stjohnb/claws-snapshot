name: Notify on main build failure

# Triggers removed for the public snapshot — this workflow is intentionally disabled.
# See the private source repository for the active version.
on:
  workflow_dispatch:
permissions:
  contents: read
  issues: write
  actions: read

# `gh` (and awk/grep for the body edits) come from this repo's flake — the
# self-hosted NixOS runners provide only nix/git/docker, so every run step
# here executes inside the flake's `scripts` devShell via the job-level
# default shell. That needs the repo checked out first, which is why both
# jobs start with a checkout they didn't previously need.
jobs:
  notify:
    runs-on: [self-hosted, linux]
    concurrency:
      group: notify-failure-${{ github.event.workflow_run.name }}
      cancel-in-progress: false
    if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.head_branch == 'main'
    defaults:
      run:
        shell: nix --extra-experimental-features nix-command --extra-experimental-features flakes develop ${{ github.workspace }}#scripts --command bash -euo pipefail {0}
    steps:
      - uses: actions/checkout@v7
      - name: Set up Nix
        uses: ./.github/actions/setup-nix
      - name: Create failure issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          REPO: ${{ github.repository }}
        run: |
          # On recurrence: edit issue body to bump Occurrences/Last seen instead of commenting.
          set -euo pipefail
          gh label create bug --color d73a4a --repo "$REPO" 2>/dev/null || true
          TS=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          export TITLE="Build failure: ${WORKFLOW_NAME}"
          # Exact-title scan over the strongly-consistent list endpoint. The
          # search index lags issue creation by minutes, so `--search
          # "... in:title"` misses an issue filed moments ago and files a
          # duplicate instead of bumping Occurrences.
          existing=$(gh issue list --repo "$REPO" --state open --limit 200 \
            --json number,title \
            --jq '[.[] | select(.title == $ENV.TITLE) | .number] | first // empty')
          if [ -n "$existing" ]; then
            body=$(gh issue view "$existing" --repo "$REPO" --json body --jq .body)
            if printf '%s' "$body" | grep -q '^\*\*First seen:\*\*'; then
              new_body=$(printf '%s' "$body" | awk -v ts="$TS" '
                /^\*\*Last seen:\*\*/ { print "**Last seen:** " ts; next }
                /^\*\*Occurrences:\*\* / { print "**Occurrences:** " ($2 + 1); next }
                { print }')
            else
              new_body="${body}"$'\n\n---\n**First seen:** '"${TS}"$'\n**Last seen:** '"${TS}"$'\n**Occurrences:** 2'
            fi
            gh issue edit "$existing" --repo "$REPO" --body "$new_body"
          else
            body=$'Workflow **'"${WORKFLOW_NAME}"$'** failed on `main`: '"${RUN_URL}"$'\n\n---\n**First seen:** '"${TS}"$'\n**Last seen:** '"${TS}"$'\n**Occurrences:** 1'
            gh issue create --repo "$REPO" --title "$TITLE" --body "$body" --label bug
          fi

  close-on-recovery:
    runs-on: [self-hosted, linux]
    concurrency:
      group: notify-failure-${{ github.event.workflow_run.name }}
      cancel-in-progress: false
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    defaults:
      run:
        shell: nix --extra-experimental-features nix-command --extra-experimental-features flakes develop ${{ github.workspace }}#scripts --command bash -euo pipefail {0}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
      - name: Set up Nix
        uses: ./.github/actions/setup-nix
      - name: Close failure issue if open
        run: |
          set -euo pipefail
          export TITLE="Build failure: ${WORKFLOW_NAME}"
          # Close every exact-title match, not just the first: duplicates filed
          # while the search index was stale would otherwise linger forever.
          matches=$(gh issue list --repo "$REPO" --label bug --state open --limit 200 \
            --json number,title \
            --jq '.[] | select(.title == $ENV.TITLE) | .number')
          for n in $matches; do
            gh issue close "$n" --repo "$REPO" \
              --comment "Build recovered — closing automatically."
          done
