name: Claude Code Release

# Reads the latest Forgejo release and checks the LAN registry image.
#
# The image disables the Claude CLI's self-updater (#3088 — uid 1000 can never
# write to the root-owned npm prefix it was installed into), so new CLI versions
# only reach sessions through a new image. This checks npm daily and calls
# release.yml when the latest release did not ship the current version, or when
# that release's image never got pushed.
#
# It is a separate workflow rather than a `schedule` trigger on release.yml:
# - main-build-monitor treats a workflow's newest push/schedule run as its state,
#   so a no-op scheduled success in Release's history would close an open Release
#   failure alert while the pipeline is still broken.
# - release.yml's workflow-level `release` concurrency group keeps one pending run,
#   and a new one cancels it. This file's own `check` job runs outside that group,
#   so a no-op scheduled check never joins it or evicts a pending push release.
#   When it does call release.yml, both a push run and this call build current
#   main HEAD (#3096), so replacing a pending push release loses nothing either way.
# The release runs via `workflow_call`, not a workflow dispatch, so a failed
# scheduled release is reported under this workflow's name; main-build-monitor
# ignores `workflow_dispatch` runs.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

env:
  NIX_FLAGS: --extra-experimental-features nix-command --extra-experimental-features flakes
  IMAGE: registry.home.bstjohn.net/st-john-software/claws

jobs:
  check:
    runs-on: [self-hosted, linux]
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      build: ${{ steps.check.outputs.build }}
    steps:
      - uses: https://github.com/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Nix
        uses: ./.github/actions/setup-nix
      - name: Resolve npm's latest Claude Code version
        id: npm
        run: |
          v=""
          for i in 1 2 3; do
            v=$(nix $NIX_FLAGS develop --command npm view @anthropic-ai/claude-code@latest version) && break
            echo "npm view attempt $i failed, retrying after 10s" >&2
            v=""
            sleep 10
          done
          if ! echo "$v" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::npm view returned an unexpected Claude Code version after 3 attempts: '$v'"
            exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: Check for a new Claude Code version
        id: check
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_VERSION: ${{ steps.npm.outputs.version }}
          LAN_USER: ${{ secrets.LAN_REGISTRY_PULL_USER }}
          LAN_PASS: ${{ secrets.LAN_REGISTRY_PULL_PASSWORD }}
        run: |
          nix $NIX_FLAGS develop .#scripts --command bash -euo pipefail <<'SCRIPT'
          v="$NPM_VERSION"

          # /releases/latest returns the newest published release, skipping
          # drafts and pre-releases. A failure here (auth, API 5xx) must not
          # read as "no previous version", or every day would cut a release,
          # so --fail-with-body makes any HTTP error fatal. `-K -` keeps the
          # token out of curl's argv.
          if ! release=$(curl --fail-with-body -sS --max-time 30 -K - \
              "${GITHUB_SERVER_URL}/api/v1/repos/${GITHUB_REPOSITORY}/releases/latest" <<EOF
          header = "Authorization: token ${TOKEN}"
          EOF
          ); then
            echo "::error::GET releases/latest failed; cannot tell which Claude Code version the latest release shipped: $release"
            exit 1
          fi
          tag=$(printf '%s' "$release" | jq -r '.tag_name // empty')
          publishedAt=$(printf '%s' "$release" | jq -r '.published_at // empty')
          if [ -z "$tag" ] || [ -z "$publishedAt" ]; then
            echo "::error::releases/latest returned no tag_name/published_at"
            exit 1
          fi
          # Empty only for a release cut before #3088 started recording the version.
          last=$(printf '%s' "$release" | jq -r '.body // ""' | tr -d '\r' | grep -m1 '^Claude Code CLI: ' | sed 's/^Claude Code CLI: //' || true)
          if [ -z "$last" ] || [ "$last" != "$v" ]; then
            echo "Claude Code version changed (latest release $tag: '${last:-none}', npm latest: '$v'), releasing"
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          missing=""
          [ -n "${LAN_USER:-}" ] || missing="$missing LAN_REGISTRY_PULL_USER"
          [ -n "${LAN_PASS:-}" ] || missing="$missing LAN_REGISTRY_PULL_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing — needed to inspect $IMAGE on registry.home.bstjohn.net"
            exit 1
          fi
          printf '%s' "$LAN_PASS" | docker login registry.home.bstjohn.net -u "$LAN_USER" --password-stdin
          trap 'docker logout registry.home.bstjohn.net >/dev/null 2>&1 || true' EXIT

          # The version line is written when the release is created, before the
          # docker job runs, so a release whose image build failed would
          # otherwise count as shipped.
          image="$IMAGE:$tag"
          if out=$(docker manifest inspect "$image" 2>&1 >/dev/null); then
            echo "Claude Code version unchanged ($v) and $image exists, skipping release"
            echo "build=false" >> "$GITHUB_OUTPUT"
          elif echo "$out" | grep -qiE 'no such manifest|manifest unknown'; then
            # A release younger than 45 minutes may just still be building; only
            # treat an older, still-missing image as failed.
            age=$(( $(date +%s) - $(date -d "$publishedAt" +%s) ))
            if [ "$age" -gt 2700 ]; then
              echo "Claude Code version unchanged ($v) but $image was never pushed (release is $((age / 60))m old), releasing"
              echo "build=true" >> "$GITHUB_OUTPUT"
            else
              echo "Claude Code version unchanged ($v) but $image build may still be in progress (release is $((age / 60))m old), skipping"
              echo "build=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "::error::docker manifest inspect $image failed: $out"
            exit 1
          fi
          SCRIPT

  release:
    needs: check
    if: needs.check.outputs.build == 'true'
    permissions:
      contents: write
    uses: ./.forgejo/workflows/release.yml
    secrets: inherit
